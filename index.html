<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio de test</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      color: #222;
      background: #f5f5f5;
      line-height: 1.6;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 80px 24px;
    }

    header {
      margin-bottom: 48px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .intro {
      color: #666;
      font-size: 1.1rem;
    }

    section {
      background: #fff;
      padding: 32px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    h2 {
      font-size: 1.3rem;
      margin-bottom: 20px;
    }

    ul {
      list-style: none;
      display: grid;
      gap: 12px;
    }

    li {
      padding: 14px 16px;
      background: #f7f7f7;
      border-radius: 5px;
      color: #444;
    }

    footer {
      margin-top: 48px;
      text-align: center;
      color: #888;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Portfolio de test</h1>
      <p class="intro">
        Bienvenue sur ce portfolio de démonstration. Il présente quelques
        compétences fictives dans un format simple et anonyme.
      </p>
    </header>

    <section>
      <h2>Compétences</h2>
      <ul>
        <li>Créativité numérique</li>
        <li>Analyse conceptuelle</li>
        <li>Organisation expérimentale</li>
      </ul>
    </section>

    <footer>
      &copy; 2026 — Portfolio de test
    </footer>
  </main>
</body>
</html>
